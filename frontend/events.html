<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Events — Smart Event Management Portal</title>
  <meta name="description" content="Browse and search upcoming events. Filter by category, sort by date or price, and book your tickets instantly." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       NAVIGATION (shared across all inner pages)
       ═══════════════════════════════════════════════ -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">

      <!-- Logo -->
      <a href="events.html" class="nav__logo" aria-label="SEMP home">
        <span class="nav__logo-dot"></span>
        SEMP
      </a>

      <!-- Nav links — hidden on mobile until burger clicked -->
      <ul class="nav__links" id="navLinks" role="menubar">
        <li role="none">
          <a href="events.html" class="nav__link" role="menuitem" id="navEvents">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16" aria-hidden="true"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
            Events
          </a>
        </li>
        <li role="none">
          <a href="history.html" class="nav__link" role="menuitem">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16" aria-hidden="true"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>
            My Bookings
          </a>
        </li>
        <!-- Admin link — shown only to admin via JS -->
        <li role="none" id="adminNavLink" style="display:none">
          <a href="admin.html" class="nav__link" role="menuitem">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16" aria-hidden="true"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
            Admin
          </a>
        </li>
      </ul>

      <!-- Right-side actions -->
      <div class="nav__actions">
        <span class="nav__user-badge" id="navUser" aria-label="Logged-in user"></span>
        <button id="darkModeToggle" class="btn-icon" aria-label="Toggle dark mode" title="Dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <a href="#" id="logoutBtn" class="btn btn--ghost btn--sm" role="button">Sign out</a>
        <!-- Mobile hamburger -->
        <button class="nav__burger" id="navBurger" aria-expanded="false" aria-label="Open menu" aria-controls="navLinks">
          <span class="burger-icon">☰</span>
        </button>
      </div>

    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════════════ -->
  <main class="page-wrapper">
    <div class="container">

      <!-- Page header -->
      <header class="page-header animate-fade-up">
        <p class="page-header__eyebrow">Upcoming Events</p>
        <h1 class="page-header__title">Find your next<br/>experience.</h1>
        <p class="page-header__subtitle">Curated events across music, tech, food, art, and more — search, filter, and book in seconds.</p>
      </header>

      <!-- Search + sort controls -->
      <div class="events-controls animate-fade-up" style="animation-delay:100ms">
        <div class="search-wrapper">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
          </svg>
          <input
            type="search"
            id="searchInput"
            class="form-input search-input"
            placeholder="Search events, locations, categories…"
            aria-label="Search events"
            autocomplete="off"
          />
        </div>

        <div class="form-group" style="min-width:180px; margin:0">
          <select id="sortSelect" class="form-select" aria-label="Sort events">
            <option value="">Sort: Default</option>
            <option value="date">Sort: Earliest first</option>
            <option value="price-asc">Sort: Price low → high</option>
            <option value="price-desc">Sort: Price high → low</option>
            <option value="seats">Sort: Most seats available</option>
          </select>
        </div>
      </div>

      <!-- Category filter pills -->
      <div class="filter-pills animate-fade-up" role="group" aria-label="Filter by category" style="animation-delay:150ms">
        <button class="filter-pill filter-pill--active" data-cat="All"        id="filterAll">All</button>
        <button class="filter-pill" data-cat="Music"       id="filterMusic">🎵 Music</button>
        <button class="filter-pill" data-cat="Conference"  id="filterConf">💡 Conference</button>
        <button class="filter-pill" data-cat="Food"        id="filterFood">🍜 Food</button>
        <button class="filter-pill" data-cat="Art"         id="filterArt">🎨 Art</button>
        <button class="filter-pill" data-cat="Sports"      id="filterSports">🏃 Sports</button>
        <button class="filter-pill" data-cat="Workshop"    id="filterWorkshop">🌱 Workshop</button>
        <button class="filter-pill" data-cat="Film"        id="filterFilm">🎬 Film</button>
        <button class="filter-pill" data-cat="Business"    id="filterBusiness">💼 Business</button>
      </div>

      <!-- Result count -->
      <div class="events-meta animate-fade-up" style="animation-delay:200ms">
        <span class="result-count" id="resultCount" aria-live="polite" aria-atomic="true"></span>
      </div>

      <!-- Events grid — populated by JS -->
      <div
        id="eventsGrid"
        class="grid-auto stagger animate-fade-up"
        style="animation-delay:250ms"
        role="list"
        aria-label="Event listings"
      >
        <!-- Event cards rendered by initEventsPage() in script.js -->
        <div class="empty-state col-span-all">
          <div class="empty-state__icon">⏳</div>
          <p class="empty-state__text">Loading events…</p>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
